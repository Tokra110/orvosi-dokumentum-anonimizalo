# Release pipeline: on a v* tag, build lean bundles (no models — the app
# downloads them on first run) for Linux (.tar.gz + .rpm) and Windows
# (installer .exe + portable .zip), then attach everything to a GitHub Release.
#
# Inert until this project lives in its own GitHub repository.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build deps
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libegl1
          pip install -r requirements-build.txt
      - name: Build bundle
        run: pyinstaller packaging/medical-redactor.spec --noconfirm
      - name: Selftest bundle
        run: ./dist/medical-redactor/medical-redactor --selftest
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "dist/medical-redactor-$VERSION-linux-x86_64.tar.gz" medical-redactor
          bash packaging/build_rpm.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.rpm

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build deps
        run: pip install -r requirements-build.txt
      - name: Build bundle
        run: pyinstaller packaging/medical-redactor.spec --noconfirm
      - name: Selftest bundle
        shell: bash
        run: ./dist/medical-redactor/medical-redactor.exe --selftest
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          $numericVersion = ($version -split "-", 2)[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DMyAppNumericVersion=$numericVersion" `
            "packaging\medical-redactor.iss"
      - name: Test installed application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Medical Redactor install"
          $staleFile = Join-Path $installDir "_internal\stale-runtime-file.txt"
          New-Item -ItemType Directory -Force (Split-Path $staleFile) | Out-Null
          Set-Content $staleFile "old runtime"

          $installer = Get-ChildItem "dist\*-setup.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
              "/DIR=`"$installDir`"") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)"
          }
          if (Test-Path $staleFile) {
            throw "Installer did not replace the old runtime tree"
          }

          $resource = Join-Path $installDir `
            "_internal\docling_parse\pdf_resources\glyphs\standard\additional.dat"
          if (-not (Test-Path $resource)) {
            throw "Installed Docling PDF resource is missing: $resource"
          }

          & (Join-Path $installDir "medical-redactor.exe") --selftest
          if ($LASTEXITCODE -ne 0) {
            throw "Installed application self-test exited with code $LASTEXITCODE"
          }
      - name: Package portable bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist && 7z a "medical-redactor-$VERSION-windows-x86_64.zip" medical-redactor
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
